<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple chat with Qwen3-8B running on your computer.">
  <title>Qwen — Local chat</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a574b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='23' fill='white'%3EQ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <div class="monogram" aria-hidden="true">Q</div>
      <div>
        <h1>Qwen3-8B</h1>
        <p>Local chat</p>
      </div>
      <span class="local-label">On your computer</span>
    </header>

    <section id="conversation" class="conversation" aria-label="Conversation" tabindex="0">
      <div id="empty-state" class="empty-state">
        <h2>Start a conversation</h2>
        <p>Ask a question or try out an idea.</p>
      </div>
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>

    <div class="composer">
      <p id="status" class="status" role="status"></p>
      <p id="error" class="error" role="alert" hidden></p>
      <form id="chat-form">
        <label for="message">Message Qwen</label>
        <div class="input-row">
          <textarea id="message" name="message" rows="2" placeholder="Type your message..." aria-describedby="input-hint" required></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </div>
        <p id="input-hint" class="hint">Enter to send · Shift+Enter for a new line</p>
      </form>
      <p class="session-note">Each message is answered independently. This conversation clears on refresh.</p>
      <noscript><p class="error">Enable JavaScript in your browser to send messages.</p></noscript>
    </div>
  </main>
</body>
</html>
